<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="vibeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="#0B0E14" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#vibeGrad)" fill-opacity="0.15" stroke="url(#vibeGrad)" stroke-width="8" />

  <!-- Vibe Pulse Waves & Ascending Arrow Logo Mark -->
  <g filter="url(#shadow)">
    <!-- Main Vibe Arrow Vector -->
    <path d="M 120 180 L 210 340 L 290 240 L 350 300 L 400 160" stroke="url(#vibeGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 330 160 L 400 160 L 400 230" stroke="url(#vibeGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Secondary Frequency Wave Lines -->
    <path d="M 110 260 Q 160 210 210 280 T 310 230 T 400 240" stroke="#06B6D4" stroke-width="16" stroke-linecap="round" opacity="0.6" />

    <!-- Signal Nodes -->
    <circle cx="210" cy="340" r="16" fill="#818CF8" />
    <circle cx="290" cy="240" r="16" fill="#A78BFA" />
    <circle cx="400" cy="160" r="20" fill="#22D3EE" />
  </g>
</svg>
